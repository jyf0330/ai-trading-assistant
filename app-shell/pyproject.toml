[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-assistant-shell"
version = "0.1.0"
description = "Lightweight local integration shell for AI trading assistant vendors"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "jinja2>=3.1.0",
  "httpx>=0.28.0",
]

[project.scripts]
app-shell-collect = "app_shell.collectors:main"
app-shell-web = "app_shell.main:main"

[tool.setuptools.packages.find]
include = ["app_shell*"]
